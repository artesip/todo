[databases]
auth_db = host=user_todo_db port=5432 dbname=users_todo user=root password=1234 pool_mode=transaction
auth_db_ro = host=auth_haproxy_replicas port=5432 dbname=users_todo user=root password=1234 pool_mode=transaction

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
