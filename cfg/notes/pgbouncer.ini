[databases]
notes_db = host=notes_db_primary port=5432 dbname=notes_db user=postgres password=123 pool_mode=transaction
notes_db_ro = host=haproxy_replicas port=5432 dbname=notes_db user=postgres password=123 pool_mode=transaction

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
