volumes:
  pg_data:
    name: notes_pg_data
  notes_primary_data:
    name: notes_primary_data
  postgresql_replica1_data:
    name: postgresql_replica1_data
  postgresql_replica2_data:
    name: postgresql_replica2_data
  notes_storage:
    name: notes_service_volume

networks:
  network:
    driver: bridge
    name: notes_network

services:
  web:
    build:
      context: web
    networks:
      network:
        aliases:
          - web-hub
    restart: always

  auth:
    build:
      context: grpc-auth
    networks:
      network:
        aliases:
          - auth-service-hub
    restart: always

  user_todo_db:
    image: postgres:18
    container_name: user_todo_db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    env_file:
      - path: ./.env
    volumes:
      - ./grpc-auth/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:7432:5432"
    networks:
      - network
    restart: always

  notes_db_primary:
    image: bitnami/postgresql:latest
    container_name: notes_db_primary
    environment:
      - POSTGRESQL_DATABASE=${DB_NAME_NOTES}
      - POSTGRESQL_USERNAME=${DB_USER_NOTES}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD_NOTES}
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_LOG_STATEMENT=all
      - POSTGRESQL_LOG_CONNECTIONS=on
    volumes:
      - ./note-service/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
      - notes_primary_data:/bitnami/postgresql
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_NOTES} -d ${DB_NAME_NOTES}"]
      interval: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  notes_db_replica:
    image: bitnami/postgresql:latest
    depends_on:
      - notes_db_primary
    environment:
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=${DB_PASSWORD_NOTES}
      - POSTGRESQL_DATABASE=${DB_NAME_NOTES}
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=notes_db_primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_LOG_STATEMENT=all
      - POSTGRESQL_LOG_CONNECTIONS=on
    volumes:
      - postgresql_replica1_data:/bitnami/postgresql
    networks:
      network:
        aliases:
          - notes-replica-pool
    restart: always

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    depends_on:
      - notes_db_primary
      - haproxy_replicas
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./userlist.txt:/etc/pgbouncer/userlist.txt
    ports:
      - "127.0.0.1:6432:6432"
    networks:
      - network
    restart: always

  haproxy_replicas:
    image: haproxy:2.8
    container_name: haproxy_replicas
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - network
    depends_on:
      - notes_db_primary
      - notes_db_replica
    ports:
      - "127.0.0.1:8404:8404"

  note_gateway:
    image: nginx:latest
    container_name: note_gateway
    volumes:
      - ./cfg/note_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8888:8888"
    networks:
      - network
    depends_on:
      - note_app
  
  auth_gateway:
    image: nginx:latest
    container_name: auth_gateway
    volumes:
      - ./cfg/auth_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    networks:
      - network
    depends_on:
      - note_app

  web_gateway:
    image: nginx:latest
    container_name: web_gateway
    volumes:
      - ./cfg/web_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "7777:7777"
    networks:
      - network
    depends_on:
      - note_app

  note_app:
    build:
      context: note-service
    env_file:
      - .env
    networks:
      network:
        aliases:
          - note-service-pool
    depends_on:
      notes_db_primary:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: always