server:
  port: ${APP_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:notes_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:123}
  jpa:
    hibernate:
      ddl-auto: update

grpc:
  client:
    auth-service:
      address: 'static://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:9000}'
      negotiationType: plaintext