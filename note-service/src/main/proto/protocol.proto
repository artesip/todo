syntax = "proto3";

option java_package = "org.example.grpc";
option java_multiple_files = true;

option go_package = "proto/grpc-auth";

service AuthService {
  rpc IsValidToken(TokenRequest) returns (IsValidTokenRequest) {} //
}

message TokenRequest {
  string token = 1; //
}

message IsValidTokenRequest {
  bool valid = 1; // [cite: 2]
}