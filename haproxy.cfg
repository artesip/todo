defaults
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

listen postgres_replicas
    bind *:5432
    balance roundrobin
    option tcp-check
    server replica1 notes_db_replica_1:5432 check on-marked-up shutdown-backup-sessions
    server replica2 notes_db_replica_2:5432 check on-marked-up shutdown-backup-sessions
    server master_backup notes_db_primary:5432 check backup

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
